<!DOCTYPE html>
<html>
    <head>
        <title>StudyMate</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Welcome to StudyMate</h1>
        <p>Student Study Management System</p>
        <a href="subjects.html">Subjects</a>
        <a href="task.html">Tasks</a>
        <a href="Reports.html">Reports</a>
        <a href="quiz.html">Quiz</a>
        <h2>Dashboard</h2>
        <div class="card">
            <h3>Subjects</h3>
            <p id="subjectCount">0</p>
        </div>
        <div class="card">
            <h3>Total Tasks</h3>
            <p id="totalTaskCount">0</p>
        </div>
        <div class="card">
            <h3>Completed Tasks</h3>
            <p id="completedTaskCount">0</p>
        </div>
        <div class="card">
            <h3>Pending Tasks</h3>
            <p id="pendingTaskCount">0</p>
        </div>
        <div class="card">
            <h3>Completion Rate</h3>
            <p id="completionRate">0%</p>
        </div>
        <script src="dashboard.js"></script>  
    </body>
</html>
